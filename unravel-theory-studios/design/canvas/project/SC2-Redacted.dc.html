<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene 2 Redacted</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&amp;family=IBM+Plex+Sans+Condensed:wght@700&amp;display=swap">
<style>
body{margin:0}
a{color:#B3261E}a:hover{color:#141414}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #2B2E31; color: #141414; font-family: 'Courier Prime', 'Courier New', monospace">
  <svg width="1280" height="720" viewBox="0 0 1280 720" style="position: absolute; inset: 0" role="img" aria-label="The Archivist is shocked as a redaction bar peels away on a classified memo, while Nan looks smug">
    <defs><filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/></filter></defs>
    <g transform="rotate(-2 400 360)" filter="url(#sh)"><rect x="80" y="40" width="640" height="700" fill="#F4F2EC"/></g>
    <g transform="rotate(-2 400 360)">
      <path d="M120 150 H680" stroke="#141414" stroke-width="2"/>
      <rect x="120" y="220" width="220" height="24" fill="#141414"/><rect x="350" y="220" width="200" height="24" fill="#141414"/>
      <rect x="120" y="266" width="380" height="24" fill="#141414"/>
      <rect x="290" y="312" width="190" height="34" fill="#F7E36A"/>
      <path d="M480 312 L600 306 L618 346 L484 348 Z" fill="#141414"/><path d="M600 306 L618 346 L630 314 Z" fill="#4A4A4A"/>
      <rect x="120" y="370" width="460" height="24" fill="#141414"/><rect x="120" y="416" width="300" height="24" fill="#141414"/>
    </g>
    <sc-for list="{{ chars }}" as="c" hint-placeholder-count="2">
      <g transform="{{ c.t }}">
        <sc-for list="{{ c.shapes }}" as="s" hint-placeholder-count="12">
          <path d="{{ s.d }}" fill="{{ s.fill }}" stroke="{{ s.stroke }}" stroke-width="{{ s.sw }}" stroke-linecap="round" stroke-linejoin="round"/>
        </sc-for>
      </g>
    </sc-for>
  </svg>
  <div style="position: absolute; left: 120px; top: 92px; width: 560px; transform: rotate(-2deg); transform-origin: 280px 268px; font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.2em">BUREAU OF RECORDS · FILE 1816/07</div>
  <div style="position: absolute; left: 120px; top: 318px; width: 600px; transform: rotate(-2deg); transform-origin: 280px 42px; display: flex; gap: 18px; align-items: baseline; font-weight: 700; font-size: 22px"><span>Observed:</span><span style="font-size: 24px">SNOW IN JULY</span></div>
  <div style="position: absolute; right: 40px; top: 28px; font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.2em; color: #C9CCCF">CHAPTER 01 · REDACTED</div>
  <div style="position: absolute; left: 0; right: 0; bottom: 36px; display: flex; justify-content: center">
    <span style="background: #141414; color: #F4F2EC; font-size: 26px; padding: 8px 18px">The records say it plainly: snow, in July.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
  const K = '#111111', R = '#D9363E', W = '#FFFFFF', B = '#5BB8F0', P = '#F08AA0', N = 'none';
  const f = (d, fill, stroke, sw) => ({ d, fill: fill || N, stroke: stroke || N, sw: sw || 0 });
  const capsule = (x, y, w, h) => 'M' + x + ' ' + (y + w / 2) + ' a' + w / 2 + ' ' + w / 2 + ' 0 0 1 ' + w + ' 0 v' + (h - w) + ' a' + w / 2 + ' ' + w / 2 + ' 0 0 1 ' + (-w) + ' 0 z';
  const circ = (cx, cy, r) => 'M' + (cx - r) + ' ' + cy + ' a' + r + ' ' + r + ' 0 1 0 ' + 2 * r + ' 0 a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0 z';
  const eyes = (w, h, y) => [f(capsule(182 - w, y, w, h), K), f(capsule(218, y, w, h), K)];
  const shine = (y) => [f(circ(166, y, 7), W), f(circ(236, y, 7), W)];
  const FACES = {
    shocked: [...eyes(44, 82, 124), ...shine(150), f(circ(200, 258, 22), R, K, 8), f('M64 96 l-26 -22 M336 96 l26 -22 M54 176 h-34 M346 176 h34', N, K, 8)],
    smug: [f('M148 156 h44 v16 a22 22 0 0 1 -44 0 z', K), f('M208 156 h44 v16 a22 22 0 0 1 -44 0 z', K), f('M142 150 h56 M204 150 h56', N, K, 10), f('M204 130 q24 -16 50 -4', N, K, 9), f('M172 246 q40 12 64 -14', N, K, 9)]
  };
  const POSES = {
    armsUp: ['M200 300 V430 M200 350 L124 256 M200 350 L276 256 M200 430 L160 524 M200 430 L240 524', 'M262 268 l16 6'],
    stand: ['M200 300 V430 M200 350 L140 420 M200 350 L260 420 M200 430 L168 524 M200 430 L232 524', 'M250 404 l14 14']
  };
  const HATS = {
    cap: [f('M92 132 C 100 50 300 50 308 132 C 250 110 150 110 92 132 Z', '#D9A441', K, 8), f('M70 142 C 140 112 250 110 318 132 C 250 128 150 132 70 142 Z', '#B9852C', K, 8), f(circ(200, 72, 9), K)],
    bun: [f(circ(200, 48, 34), '#A8A8A8', K, 8), f('M90 150 C 96 58 304 58 310 150 C 250 118 150 118 90 150 Z', '#C4C4C4', K, 8)]
  };
  const person = (face, pose, hat, wrist) => [f(POSES[pose][0], N, K, 24), ...(wrist ? [f(POSES[pose][1], N, '#C8281E', 12)] : []), f(circ(200, 180, 120), W, K, 11), f('M98 238 C 140 306 260 306 302 238 C 296 280 252 298 200 298 C 148 298 104 280 98 238 Z', '#E9E9E9'), ...HATS[hat], ...FACES[face]];
  return { chars: [
    { t: 'translate(700 150) scale(0.98)', shapes: person('shocked', 'armsUp', 'cap', true) },
    { t: 'translate(1010 300) scale(0.66)', shapes: person('smug', 'stand', 'bun', false) }
  ] };
}
}
</script>
</body>
</html>
